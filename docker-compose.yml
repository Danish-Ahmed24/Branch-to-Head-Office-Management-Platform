services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: shiplens
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d shiplens']
      interval: 5s
      timeout: 3s
      retries: 10
  web:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/shiplens
      PORT: '8000'
      CORS_ORIGINS: '[]'
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
