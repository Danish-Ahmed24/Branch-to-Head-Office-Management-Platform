# Review service pricing before creating resources. This is a deployment
# definition, not evidence of a live deployment.
services:
  - type: web
    name: shiplens
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shiplens-db
          property: connectionString
      - key: CORS_ORIGINS
        value: '[]'
databases:
  - name: shiplens-db
    databaseName: shiplens
    user: shiplens
    plan: free
